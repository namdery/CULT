<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>CULT</title>
  <link rel="stylesheet" href="styles.css?v=23">
</head>
<body>
  <main>
    <section class="wallet">
      <span>КОШЕЛЁК</span>
      <div class="balance"><span class="money">$</span><span class="number">0</span><span class="punctuation">.</span><span class="number cents">00</span></div>
      <p>Кошелёк появится позже</p>
    </section>
    <section class="actions">
      <div class="action-item"><button aria-label="Вывод"><i>↑</i></button><b>Вывод</b></div>
      <div class="action-item"><button aria-label="Пополнение"><i>↓</i></button><b>Пополнение</b></div>
      <div class="action-item"><button aria-label="Обмен"><i class="swap-arrows"><span>↑</span><span>↓</span></i></button><b>Обмен</b></div>
    </section>
    <div class="hero"><img src="assetslast-upload.png?v=23" alt="CULT"><span class="tile-grid" aria-hidden="true"></span></div>
  </main>
  <script src="app.js?v=23"></script>
</body>
</html>
